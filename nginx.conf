
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # custom log format
    #  - more readable format 
    #  - includes proxy host
    #  - includes virtual host, because we only have one log stream, and multiple hosts
    log_format  main  'ts=$time_iso8601 status=$status method=$request_method uri=$host$request_uri proxy=$proxy_host '
                      'ms=$request_time bytes=$bytes_sent/$request_length '
                      'ua="$http_user_agent" ip=$remote_addr user=$remote_user';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    # Verify the TLS certificate presented by every proxied upstream server.
    # nginx's default proxy_ssl_verify_depth of 1 is too short for typical
    # upstream chains (server certificate -> intermediate -> root).
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
